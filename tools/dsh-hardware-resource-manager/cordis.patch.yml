- insert:
    - id: dsh-hardware-resource-manager
      name: dsh-hardware-resource-manager
    - id: pwsh-resource-sandbox
      name: dsh-hardware-resource-manager/pwsh
      disabled: !!js process.platform !== 'win32' || process.arch !== 'x64'
    - id: ptc-resource-runtime
      name: dsh-hardware-resource-manager/ptc
      disabled: !!js process.platform !== 'win32' || process.arch !== 'x64'

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32' || process.arch === 'x64'

- id: ptc-runtime
  name: '@deepseek-ai/dsh-ptc-runtime-node'
  disabled: !!js process.platform === 'win32' && process.arch === 'x64'
