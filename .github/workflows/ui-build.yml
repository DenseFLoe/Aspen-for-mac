name: Qt UI build
on:
  push:
    branches: ["codex/**", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt build dependencies
        run: brew install qt ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test navigation and assets
        run: ctest --test-dir build --output-on-failure
