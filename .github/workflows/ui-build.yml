name: Qt UI build
on:
  push:
    branches: ["codex/**", main]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check resource parsers and catalog
        run: |
          python -m pip install pefile==2024.8.26 dnfile==0.18.0
          python -m unittest discover -s tests -p test_ui_resources.py -v
          python -m unittest discover -s tests -p test_plaintext_export.py -v
          python -m unittest discover -s tests -p test_runtime_database.py -v
          python tools/verify_ui_catalog.py ui/recovered
      - name: Install build dependencies
        run: brew install ninja
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: clang_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test navigation and assets
        run: ctest --test-dir build --output-on-failure
      - name: Verify packaged Qt and SQLite dependencies
        run: sh tools/package_macos.sh build "$QT_ROOT_DIR"
