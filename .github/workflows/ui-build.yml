name: Source research checks
on:
  push:
    branches: ["codex/**", main]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check research tools and resource catalog
        run: |
          python -m pip install pefile==2024.8.26 dnfile==0.18.0 beautifulsoup4==4.15.0
          python -m unittest discover -s tests -p test_ui_resources.py -v
          python -m unittest discover -s tests -p test_plaintext_export.py -v
          python -m unittest discover -s tests -p test_runtime_database.py -v
          python -m unittest discover -s tests -p test_formula_extraction.py -v
          python tools/verify_ui_catalog.py ui/recovered
