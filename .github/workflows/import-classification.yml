name: Import complete classification lists
on:
  push:
    branches: ["codex/publish-classification-lists"]
    paths: ["classification-transfer/**"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and verify reviewed metadata
        run: python classification-transfer/restore.py
      - name: Commit verified complete lists to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish complete Plus and Properties classification lists'
          git push origin HEAD:refs/heads/codex/publish-classification-lists
