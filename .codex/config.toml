# Aspen-only tool policy. Keep full tool schemas out of the initial prompt.
# No model, credential, sandbox or approval settings are changed here.

[features]
code_mode = true
code_mode_only = true
code_mode_tool_search = true

# Connected apps are opt-in for this project; repository access is required.
[apps._default]
enabled = false

[apps.connector_76869538009648d5b282a4bb21c3d157]
enabled = true

# Keep browser/computer-use, PDF evidence and Codex app tools available.
# The following authoring plugins are unrelated to file-by-file reverse work.
[plugins."visualize@openai-bundled"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false
